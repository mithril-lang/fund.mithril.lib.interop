name: Native interoperability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . opendis==1.0
      - run: ./scripts/build-hla.sh
      - run: python scripts/fetch-c2sim-schema.py
      - run: python -m unittest discover -s tests -v
