[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mithril-interop"
version = "0.1.0"
description = "Native XML, DIS Link 16 simulation and IEEE 1516e host adapters for Mithril"
requires-python = ">=3.11"
dependencies = ["lxml==6.1.3", "xmlschema==4.3.2"]

[project.scripts]
mithril-interop = "mithril_interop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
